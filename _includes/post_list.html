<ul class="wp-block-post-template has-body-font-family is-layout-flow wp-block-post-template-is-layout-flow">
{% for post in include.posts %}
<li class="wp-block-post post type-post status-publish format-standard hentry">
<hr class="wp-block-separator has-text-color has-contrast-3-color has-alpha-channel-opacity has-contrast-3-background-color has-background alignwide is-style-wide">
<div class="wp-block-group alignwide has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-columns alignwide are-vertically-aligned-center is-layout-flex wp-block-columns-is-layout-flex" style="margin-top:var(--wp--preset--spacing--20);margin-bottom:var(--wp--preset--spacing--20)">
<div class="wp-block-column is-vertically-aligned-center is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:72%">
<h2 style="font-size:clamp(0.984rem, 0.984rem + ((1vw - 0.2rem) * 0.86), 1.5rem);line-height:1.1;" class="wp-block-post-title has-body-font-family">
<a href="{{ post.url | relative_url }}" target="_self">{{ post.title }}</a>
</h2>
</div>
<div class="wp-block-column is-vertically-aligned-center is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:28%">
<div class="alignright wp-block-template-part">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group is-content-justification-right is-layout-flex wp-block-group-is-layout-flex" style="gap: 0.5em; flex-wrap: wrap; justify-content: flex-end;">
<div class="wp-block-post-date"><time datetime="{{ post.date | date_to_xmlschema }}"><a href="{{ post.url | relative_url }}">{{ post.date | date: "%b %-d, %Y" }}</a></time></div>
<p class="has-contrast-2-color has-text-color">&#8211;</p>
<p class="has-contrast-2-color has-text-color has-small-font-size">by</p>
<div class="wp-block-post-author-name"><a href="/author/{{ post.author | downcase }}/" target="_self" class="wp-block-post-author-name__link">{{ post.author }}</a></div>
<div class="taxonomy-category wp-block-post-terms">
<span class="wp-block-post-terms__prefix">in </span><a href="/category/{{ post.category | downcase }}/" rel="tag">{{ post.category }}</a>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</li>
{% endfor %}
</ul>
